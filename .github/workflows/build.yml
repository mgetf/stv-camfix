name: Autobuild

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish this build as (e.g. v1.0)'
        required: true
        type: string

jobs:
  run:
    name: Run action
    runs-on: ubuntu-latest
    permissions:
      contents: write

    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ci skip]') }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup SourcePawn Compiler
      uses: rumblefrog/setup-sp@master
      with:
        version: "1.12.x"

    - name: Compile plugins
      run: |
        mkdir -p plugins
        spcomp scripting/mge_stv_camfix.sp -o ./plugins/mge_stv_camfix.smx
        test -s plugins/mge_stv_camfix.smx
        ls -la plugins/

    - name: Zip packages
      run: |
        mkdir build
        7za a -r build/mge-stv-camfix.zip plugins/ gamedata/ scripting/
        unzip -l build/mge-stv-camfix.zip
        test "$(unzip -Z1 build/mge-stv-camfix.zip | grep -c '\.smx$')" -ge 1
        test "$(unzip -Z1 build/mge-stv-camfix.zip | grep -c 'gamedata/mge_stv_camfix.txt')" -ge 1

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        files: |
          ./build/mge-stv-camfix.zip
        fail_on_unmatched_files: true
        generate_release_notes: true
